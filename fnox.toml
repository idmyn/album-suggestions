if_missing = "error"

[providers]
keepass = { type = "keepass", database = "~/Tresorit/Documents/creds.kdbx" }

[secrets]
CLOUDFLARE_ACCOUNT_ID= { provider = "keepass", value = "global/cloudflare-account-id" }
CLOUDFLARE_API_TOKEN= { provider = "keepass", value = "global/cloudflare-api-token" }
OPENROUTER_API_KEY= { provider = "keepass", value = "album-suggestions/shared/openrouter-api-key" }
SPOTIFY_CLIENT_ID= { provider = "keepass", value = "album-suggestions/shared/spotify-client-id" }
SPOTIFY_CLIENT_SECRET= { provider = "keepass", value = "album-suggestions/shared/spotify-client-secret" }

[profiles.staging.secrets]
TURSO_DATABASE_URL= { provider = "keepass", value = "album-suggestions/staging/turso-database-url" }
TURSO_AUTH_TOKEN= { provider = "keepass", value = "album-suggestions/staging/turso-auth-token" }

[profiles.production.secrets]
TURSO_DATABASE_URL= { provider = "keepass", value = "album-suggestions/production/turso-database-url" }
TURSO_AUTH_TOKEN= { provider = "keepass", value = "album-suggestions/production/turso-auth-token" }
